<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="planeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#312e81" stroke-width="3" opacity="0.6" />

  <!-- Concentric Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.35" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.45" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="28" fill="#4f46e5" fill-opacity="0.3" stroke="#a5b4fc" stroke-width="2" />

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 390 122 A 190 190 0 0 1 446 256 Z" fill="#6366f1" fill-opacity="0.15" />
  <line x1="256" y1="256" x2="390" y2="122" stroke="#38bdf8" stroke-width="3" opacity="0.8" />

  <!-- Radar Crosshairs & Compass Ticks -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.5" />
  
  <text x="256" y="38" fill="#818cf8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">N</text>
  <text x="256" y="490" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">S</text>
  <text x="490" y="261" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">E</text>
  <text x="22" y="261" fill="#64748b" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">W</text>

  <!-- High-Altitude Supersonic Jet Icon Center Piece -->
  <g transform="translate(256, 256) rotate(-45) scale(1.65)" filter="url(#neonGlow)">
    <!-- Jet Shadow/Glow -->
    <path d="M 0 -48 L 10 -10 L 46 14 L 46 24 L 10 16 L 8 42 L 20 54 L 20 60 L 0 54 L -20 60 L -20 54 L -8 42 L -10 16 L -46 24 L -46 14 L -10 -10 Z" 
          fill="#38bdf8" opacity="0.4" transform="scale(1.15)" />
    <!-- Jet Body -->
    <path d="M 0 -48 L 10 -10 L 46 14 L 46 24 L 10 16 L 8 42 L 20 54 L 20 60 L 0 54 L -20 60 L -20 54 L -8 42 L -10 16 L -46 24 L -46 14 L -10 -10 Z" 
          fill="url(#planeGrad)" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
    <!-- Cockpit Canopy -->
    <ellipse cx="0" cy="-22" rx="3" ry="8" fill="#e0f2fe" />
  </g>
</svg>
